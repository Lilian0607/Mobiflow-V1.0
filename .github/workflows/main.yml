name: VENUN ENGINE Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          mkdir extracted
          unzip VENUN-ENGINE.zip -d extracted

      - name: Find project
        run: |
          PROJECT_DIR=$(dirname "$(find extracted -name settings.gradle.kts -print -quit)")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          
      - name: Inspect project structure
        run: |
          echo "PROJECT DIRECTORY:"
          echo "$PROJECT_DIR"

          echo "EXTRACTED FILES:"
          find extracted -maxdepth 7 -type f | sort

          echo "ANDROID MANIFEST:"
          find extracted -name AndroidManifest.xml -print


      - name: Build APK
        run: gradle -p "$PROJECT_DIR" --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VENUN-ENGINE-APK
          path: extracted/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
 
